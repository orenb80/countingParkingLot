version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      DATABASE_URL: sqlite:////app/data/parking.db
      # Amadeus 8 (set these in .env or here)
      # AMADEUS_HOST: 192.168.1.100
      # AMADEUS_PORT: 8080
      # AMADEUS_API_KEY: your-key
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
